<section class="container text-center d-flex py-3 h-100">
  <div class="d-flex w-100 row">
    <div class="w-50 pe-5">
      <img [src]="miUsuario?.image" alt="Usuario" class="img-fluid rounded-circle">
    </div>
    <div class="w-50 d-flex flex-column border-start border-dark">
      <ul class="list-unstyled text-start ps-5">
        <li class="pb-3 fs-3">{{ miUsuario?.first_name }}</li>
        <li class="pb-3 fs-3">{{ miUsuario?.last_name }}</li>
        <li class="pb-3"> <strong>Nombre de Usuario: </strong>{{ miUsuario?.username }} </li>
        <li class="pb-3"> <strong>Email: </strong>{{ miUsuario?.email }} </li>
      </ul>
      <div class="text-start ps-5">
        <app-buttons [miUsuario]="miUsuario" [volver]="true"></app-buttons>
      </div>
    </div>
  </div>
</section>
