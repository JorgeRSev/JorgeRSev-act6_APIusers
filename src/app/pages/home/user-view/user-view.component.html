<section class="container text-center d-flex">
  <div class="d-flex w-100">
    <div class="w-50 pe-5">
      <img [src]="miUsusario.image" alt="Usuario" class="img-fluid rounded-5">
    </div>
    <div class="w-50 d-flex flex-column justify-content-left border-start border-dark">
      <ul class="list-unstyled text-start ps-5">
        <li class="pb-3">{{ miUsusario.first_name }}</li>
        <li class="pb-3">{{ miUsusario.last_name }}</li>
        <li class="pb-3">{{ miUsusario.username }}</li>
        <li class="pb-3">{{ miUsusario.email }}</li>
      </ul>
      <div class="text-start ps-5">
        <app-buttons></app-buttons>
      </div>
    </div>
  </div>
</section>
