<section class="container p-0">
  <div class="row justify-content-center gap-3">
    @for (user of arrUsers; track user._id){
      <article class="col-12 col-md-6 col-lg-3 anchoCard">
        <div class="h-100 d-flex flex-column">
          <app-user-card [miUsuario]="user" class="h-100"></app-user-card>
        </div>
      </article>
    }
  </div>
  <div class="pagination">
    @for (page of arrPage; track page) {
      <button (click)="changePage(page)" class="btn btn-sm ">Pág {{ page }}</button>
    }
  </div>
</section>
