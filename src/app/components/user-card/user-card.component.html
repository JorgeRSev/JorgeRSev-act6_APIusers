<section class="row">
  <div class="card p-0">
    <figure>
      <img [src]="miUsuario.image" alt="imagen del usuario" class="card-img-top img-fluid w-100" />
    </figure>
    <div class="card-body text-center p-0">
      <div class="card-title mb-3">
        {{miUsuario.first_name}} {{miUsuario.last_name}}
      </div>
      <div>
        <app-buttons [miUsuario]="miUsuario"></app-buttons>
      </div>
    </div>
  </div>
</section>
